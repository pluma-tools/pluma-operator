name: Cherry-pick pull request

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

jobs:
  cherry-pick:
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/cherry-pick ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cherry-pick-${{ github.event.issue.number }}
      cancel-in-progress: false
    steps:
      - name: Validate request
        id: request
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const body = context.payload.comment.body.trim();
            const match = /^\/cherry-pick\s+(release-\d+\.\d+)$/.exec(body);
            if (!match) core.setFailed('Use /cherry-pick release-X.Y');
            else {
              const user = context.payload.comment.user.login;
              const {data: permission} = await github.rest.repos.getCollaboratorPermissionLevel({owner, repo, username: user});
              if (!['admin', 'maintain', 'write'].includes(permission.permission)) throw new Error('Write permission is required');
              const {data: pr} = await github.rest.pulls.get({owner, repo, pull_number: context.issue.number});
              if (!pr.merged || !pr.merge_commit_sha) throw new Error('The pull request must be merged');
              const {data: mergedCommit} = await github.rest.repos.getCommit({owner, repo, ref: pr.merge_commit_sha});
              if (mergedCommit.parents.length === 1 && pr.commits > 1) {
                throw new Error('Multi-commit squash or rebase merges are ambiguous; cherry-pick manually to avoid missing commits');
              }
              await github.rest.repos.getBranch({owner, repo, branch: match[1]});
              core.setOutput('branch', match[1]);
              core.setOutput('commit', pr.merge_commit_sha);
              core.setOutput('number', String(pr.number));
            }
      - name: Get GitHub App token
        id: app-token
        uses: wranders/ghapp-token-action@v1.0.2
        with:
          app_id: ${{ secrets.APP_ID }}
          app_key_pem: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.branch }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Cherry-pick and open pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          TARGET: ${{ steps.request.outputs.branch }}
          MERGE_COMMIT: ${{ steps.request.outputs.commit }}
          PR_NUMBER: ${{ steps.request.outputs.number }}
        run: |
          set -euo pipefail
          branch="cherry-pick/pr-${PR_NUMBER}-to-${TARGET}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$MERGE_COMMIT"
          if git merge-base --is-ancestor "$MERGE_COMMIT" HEAD; then
            echo 'The target branch already contains this merge commit.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git switch -c "$branch"
          parents=$(git rev-list --parents -n 1 "$MERGE_COMMIT" | wc -w | tr -d ' ')
          if [[ "$parents" -gt 2 ]]; then
            git cherry-pick -m 1 "$MERGE_COMMIT"
          else
            git cherry-pick "$MERGE_COMMIT"
          fi
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --repo "$REPO" --base "$TARGET" --head "$branch" \
            --title "cherry-pick: #$PR_NUMBER to $TARGET" \
            --body "Cherry-pick of #$PR_NUMBER to $TARGET."
